[tools]
go = "1.26"
"aqua:golangci/golangci-lint" = "2.10.1"
"aqua:mvdan/gofumpt" = "0.9.2"
"go:golang.org/x/tools/gopls" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
lefthook = "1.11.5"

[tasks.fmt]
description = "Format Go code with gofumpt"
run = "gofumpt -l -w -extra ."

[tasks.fmt-check]
description = "Fail if any file needs formatting"
run = """
unformatted=$(gofumpt -l -extra .)
if [ -n "$unformatted" ]; then
  echo "These files need formatting (run 'mise run fmt'):"
  echo "$unformatted"
  exit 1
fi
"""

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.test]
description = "Run unit tests with coverage"
run = """
go test -race -count=1 -coverprofile=coverage.out ./...
go tool cover -func=coverage.out | tail -1
"""

[tasks.test-integration]
description = "Run integration tests against a real sshd"
run = "go test -race -count=1 -tags=integration ./..."

[tasks.vuln]
description = "Scan dependencies and stdlib for known vulnerabilities"
run = "govulncheck ./..."

[tasks.build]
description = "Build the server binary"
run = """
go build -ldflags="-s -w \
  -X github.com/bojanrajkovic/ssh-mcp/internal/version.Version=dev \
  -X github.com/bojanrajkovic/ssh-mcp/internal/version.Commit=$(git rev-parse --short HEAD 2>/dev/null || echo none) \
  -X github.com/bojanrajkovic/ssh-mcp/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
  -o ssh-mcp ./cmd/ssh-mcp
"""

[tasks.ci]
description = "Everything CI runs, in CI order"
run = """
set -e
mise run fmt-check
mise run vet
mise run lint
mise run test
mise run build
"""

[settings.task]
output = "prefix"
