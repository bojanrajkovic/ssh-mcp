name: Release

on:
  push:
    branches: [main]

# Nothing is granted by default; each job asks for exactly what it needs.
permissions: {}

# Releases must not overlap: two runs racing would fight over the same tag.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the release branch and tag
      pull-requests: write # open the version-bump PR
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    name: Publish binaries
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Signing and notary credentials live on this environment rather than on
    # the repository, so no other job or workflow can read them.
    environment: release
    permissions:
      contents: write # attach assets to the release
      id-token: write # OIDC identity for build provenance
      attestations: write # store the attestation
    # The secrets context is not available in step-level `if:` conditions, so
    # secret PRESENCE is mapped to job env once here, where secrets are
    # allowed. The values are still only read where they are used.
    env:
      HAS_SIGNING_CERT: ${{ secrets.MACOS_SIGN_P12 != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # goreleaser reads tags for the changelog
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: false

      - name: Report signing status
        run: |
          if [ "$HAS_SIGNING_CERT" = "true" ]; then
            echo "Developer ID certificate present: macOS builds will be signed and notarized."
          else
            echo "::warning::No signing certificate configured; macOS builds will be unsigned."
          fi

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      # Provenance ties each archive to this workflow, this commit, and this
      # runner, so a downloader can verify with `gh attestation verify` that a
      # binary came from here rather than from someone's laptop.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
